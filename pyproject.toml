[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-mgmt"
version = "0.1.0"
description = "Template-driven invoice tool: extract data from invoices or fill/generate invoices."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6",
    "Jinja2>=3",
    "pdfplumber>=0.10",
    "pypdf>=4",
    "reportlab>=4",
    "python-docx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
invoice = "invoice_mgmt.cli:main"

[tool.setuptools.packages.find]
include = ["invoice_mgmt*"]

[tool.setuptools.package-data]
invoice_mgmt = ["templates/*.yaml", "templates/*.j2"]
